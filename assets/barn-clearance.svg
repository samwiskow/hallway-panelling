<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600"><rect width="900" height="600" fill="#faf9f5"/><g font-family="Arial,sans-serif" fill="#22352f"><text x="45" y="50" font-size="28">Behind the barn door</text><text x="45" y="80" font-size="16">Plan section through the trim. Depths enlarged for clarity.</text><rect x="80" y="135" width="600" height="45" fill="#ccd3c9"/><text x="100" y="164" font-size="18">Existing wall</text><rect x="130" y="180" width="230" height="90" fill="#728368"/><rect x="410" y="180" width="130" height="110" fill="#526b4d"/><rect x="80" y="330" width="600" height="70" fill="#c6a57c"/><text x="100" y="373" font-size="18">Door back: 15 mm from wall</text><g stroke="#22352f" stroke-width="2"><path d="M700 180H725M700 330H725M715 180V330"/><path d="M365 270H390M365 330H390M378 270V330"/><path d="M545 290H570M545 330H570M558 290V330"/></g><text x="735" y="260" font-size="18">15 mm</text><text x="175" y="215" font-size="17" fill="white">9 mm flat trim</text><text x="420" y="215" font-size="16" fill="white">11 mm frame</text><text x="205" y="311" font-size="18">6 mm remains</text><text x="410" y="318" font-size="16">4 mm remains</text><text x="45" y="454" font-size="19">Standard caps project 18, 19 or 23 mm: they do not fit here.</text><text x="45" y="491" font-size="17">Gaps shown exclude adhesive and fitting variation.</text><text x="45" y="519" font-size="17">At each corner, change to the standard cap on the adjoining wall.</text><text x="45" y="547" font-size="17">Check the actual door stops and dry-fit through the full sliding travel.</text></g></svg>